openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dishes
    description: Birmingham dish photo gallery
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /chat/system-prompt:
    get:
      operationId: getCityChatSystemPrompt
      tags: [chat]
      summary: Get the city guide system prompt
      responses:
        "200":
          description: The system prompt used by the city guide
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitySystemPrompt"
  /chat:
    post:
      operationId: sendCityChat
      tags: [chat]
      summary: Ask the Birmingham city guide a question
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CityChatInput"
      responses:
        "200":
          description: The city guide response and generation details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CityChatResponse"
        "400":
          description: The chat request is invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: The city guide could not generate an answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Gemini is not configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /dishes:
    get:
      operationId: listDishPhotos
      tags: [dishes]
      summary: List dish photos, newest first
      responses:
        "200":
          description: Dish photos without embedded image data
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DishPhoto"
    post:
      operationId: createDishPhoto
      tags: [dishes]
      summary: Add a dish photo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DishPhotoInput"
      responses:
        "201":
          description: The saved dish photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DishPhoto"
        "400":
          description: The photo details or image format are invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "413":
          description: The upload exceeds the image size limit
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: The inspector rejected the photo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DishPhotoRejection"
        "502":
          description: The dish inspector is unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
  /dishes/{id}/image:
    get:
      operationId: getDishPhotoImage
      tags: [dishes]
      summary: Get dish photo bytes
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            minimum: 1
      responses:
        "200":
          description: The original uploaded image
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "404":
          description: No dish photo exists with this ID
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ApiError:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    CityChatSettings:
      type: object
      properties:
        temperature:
          type: number
          minimum: 0
          maximum: 2
        topP:
          type: number
          minimum: 0
          maximum: 1
        maxOutputTokens:
          type: integer
          minimum: 32
          maximum: 1024
    CityChatHistoryMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
          maxLength: 4000
      required: [role, content]
    CityChatInput:
      type: object
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
        history:
          type: array
          maxItems: 24
          items:
            $ref: "#/components/schemas/CityChatHistoryMessage"
        settings:
          $ref: "#/components/schemas/CityChatSettings"
      required: [message]
    CityChatUsage:
      type: object
      properties:
        promptTokens:
          type: integer
        outputTokens:
          type: integer
        totalTokens:
          type: integer
      required: [promptTokens, outputTokens, totalTokens]
    CityChatResponse:
      type: object
      properties:
        reply:
          type: string
        usage:
          $ref: "#/components/schemas/CityChatUsage"
        settings:
          $ref: "#/components/schemas/CityChatResponseSettings"
        model:
          type: string
        truncated:
          type: boolean
      required: [reply, usage, settings, model, truncated]
    CityChatResponseSettings:
      type: object
      properties:
        temperature:
          type: number
          minimum: 0
          maximum: 2
        topP:
          type: number
          minimum: 0
          maximum: 1
        maxOutputTokens:
          type: integer
          minimum: 32
          maximum: 1024
      required: [temperature, topP, maxOutputTokens]
    CitySystemPrompt:
      type: object
      properties:
        systemPrompt:
          type: string
      required: [systemPrompt]
    DishPhotoInput:
      type: object
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 120
        caption:
          type: string
          maxLength: 500
        image:
          type: string
          minLength: 1
          maxLength: 4194327
          pattern: "^data:image/(jpeg|png|webp);base64,[A-Za-z0-9+/]+={0,2}$"
          description: JPEG, PNG, or WebP image data URL, at most 3 MiB when decoded
      required: [title, image]
    DishPhoto:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        caption:
          type: string
        mimeType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
        inspectorNote:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        imageUrl:
          type: string
      required: [id, title, caption, mimeType, inspectorNote, createdAt, imageUrl]
    DishPhotoRejection:
      type: object
      properties:
        error:
          type: string
        reason:
          type: string
      required: [error, reason]

